plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// Everything a run measures with, and nothing the product is. `jar` packs sourceSets.main
// alone, so the test classes, the harness, the subjects and the GameTest structure template
// here are absent from what is distributed — verifyNoTestScaffoldingInJar below is what keeps
// that true rather than a reading of this comment.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    mavenCentral()

    // Create is resolved here rather than dropped into run/mods by hand. The main gate
    // (UnloadedCatchUpGameTests) has no subject without it, run/ is not under version control,
    // and a jar cannot be committed, so a hand-placed one makes the gate unreachable from a
    // fresh clone.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            sourceSet = sourceSets.gametest
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // GameTest registration scans the mod's own files for @GameTestHolder and for the
            // second @Mod entrypoint that decides what a run measures, so the measurement
            // source set has to belong to the same mod. This says nothing about the jar.
            sourceSet(sourceSets.gametest)
        }
    }

    addModdingDependenciesTo(sourceSets.gametest)
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    // runGameTestServer runs off the gametest source set, so its runtime classpath is the one
    // that has to carry Create. Without this the main gate's subject is absent, createIsPresent()
    // answers no, and the run is green with the Create-dependent tests silently unregistered.
    gametestRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    // The deferral ledger is deliberately free of Minecraft types, so its invariants can be
    // checked without booting a server. GameTest covers what needs a world; this covers what
    // does not, and runs in a second rather than a minute.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // The subject the main gate measures on. A millstone is a block entity whose ticker carries
    // real work across a window, which is the thing the catch-up claims to reproduce, and no
    // vanilla block entity is a substitute. localRuntime rather than runtimeOnly: it has to be
    // there when the gate runs and must not become a dependency of anything that consumes this
    // mod. Nothing is compiled against Create — every call into it goes through reflection — so
    // this is a runtime artefact only.
    //
    // With it, the standard runGameTestServer registers 54 required tests; without it, 32.
    localRuntime "maven.modrinth:create:${create_version}"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Measurement code that stops compiling is a gate that stopped gating, so the build says so
// even though it does not run it. Running it is runGameTestServer.
tasks.named('check') {
    dependsOn tasks.named('compileGametestJava')
}

// That the jar carries none of the measurement. Nine thousand lines of it and fifteen GameTest
// classes are one `git mv` away from being shipped again, and a shipped GameTest class is not
// merely dead weight: on 26.x it lands in a real registry and the configuration-phase sync a
// client performs on join fails on it. Five independent readings, because a class can escape
// any one of them — a support class carries no `Test` in its name, and a structure template is
// not a class at all.
tasks.register('verifyNoTestScaffoldingInJar') {
    group = 'verification'
    description = 'Fails if the shipped jar contains GameTest scaffolding (classes, framework references or test structures).'

    var archiveTasks = tasks.matching { it.name == 'jar' || it.name == 'remapJar' }
    dependsOn(archiveTasks)
    inputs.files(project.provider { archiveTasks.collect { it.archiveFile.get().asFile } })
    var stamp = layout.buildDirectory.file("reports/no-test-scaffolding/${project.name}.txt")
    outputs.file(stamp)

    doLast {
        // References that appear in a class file's constant pool as plain UTF-8.
        var forbiddenReferences = [
                'net/minecraft/gametest',
                'RegisterGameTestsEvent',
                'GameTestInstance',
                'GameTestHelper',
                'TEST_INSTANCE'
        ]
        var testClassPattern = java.util.regex.Pattern.compile('.*/[A-Za-z0-9_$]*Tests?([$][^/]*)?[.]class')
        var testDirPattern = java.util.regex.Pattern.compile('(?i)(.*/)?tests?/.*')
        var structurePattern = java.util.regex.Pattern.compile('data/[^/]+/structure/.*')
        var scan = { File archive ->
            var offences = []
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (entry.directory) {
                        return
                    }
                    var name = entry.name
                    if (name.toLowerCase(Locale.ROOT).contains('gametest')) {
                        offences.add(name + '  (entry name)')
                    } else if (testDirPattern.matcher(name).matches()) {
                        offences.add(name + '  (test directory)')
                    } else if (testClassPattern.matcher(name).matches()) {
                        offences.add(name + '  (test class name)')
                    } else if (structurePattern.matcher(name).matches()) {
                        // data/<ns>/structure/ is where GameTest keeps its templates
                        // (worldgen structures live under data/<ns>/worldgen/structure/).
                        offences.add(name + '  (gametest structure template)')
                    } else if (name.endsWith('.class')) {
                        var bytes = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                        var text = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                        var hit = forbiddenReferences.find { text.contains(it) }
                        if (hit != null) {
                            offences.add(name + '  (references ' + hit + ')')
                        }
                    }
                }
            }
            return offences
        }

        var archives = archiveTasks.collect { it.archiveFile.get().asFile }
        // A gate that scans nothing reports OK. Say so instead.
        if (archives.isEmpty()) {
            throw new GradleException('verifyNoTestScaffoldingInJar found no archive to scan;'
                    + ' it cannot tell whether the jar ships test scaffolding.')
        }

        var lines = []
        var failures = []
        archives.each { archive ->
            var offences = scan(archive)
            if (offences.isEmpty()) {
                lines.add('OK ' + archive.name + ': no test scaffolding (' + archive.absolutePath + ')')
            } else {
                lines.add('FAIL ' + archive.name)
                offences.each { lines.add('  ' + it) }
                failures.add(archive.name + ' ships test scaffolding:' + System.lineSeparator()
                        + offences.collect { '  - ' + it }.join(System.lineSeparator()))
            }
        }
        var stampFile = stamp.get().asFile
        stampFile.parentFile.mkdirs()
        stampFile.text = lines.join(System.lineSeparator()) + System.lineSeparator()
        if (failures.isEmpty()) {
            logger.lifecycle('verifyNoTestScaffoldingInJar: OK — scanned '
                    + archives.collect { it.name }.join(', '))
        } else {
            throw new GradleException(failures.join(System.lineSeparator()))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyNoTestScaffoldingInJar')
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
