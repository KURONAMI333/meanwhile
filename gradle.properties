# Gradle / build infra
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Target stack. neoforge.mods.toml refers to these by name through
# generateModMetadata, so removing one breaks the build rather than the mod.
# Values are the verified 1.21.1 matrix from NEW_MOD_GUIDE.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.227
loader_version_range=[1,)

# Runtime-only test subject. The Modrinth version id, which is not the same string as the
# file name (create-1.21.1-6.0.10.jar).
create_version=6.0.10+mc1.21.1

# Mod identity
mod_id=meanwhile
mod_name=Meanwhile
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.kuronami.meanwhile
mod_authors=KURONAMI
mod_description=Advances the block entities in a chunk by the ticks they missed while it was unloaded. It works out how far to advance by ticking a block entity once and reading what changed, so it needs no support written for the machine it is advancing.
