# What only the measurement needs.
#
# Everything here widens a vanilla member for the benefit of a class in src/gametest, and none
# of it is reachable from src/main. It is kept out of src/main/resources so that it is not in
# the jar: an access transformer that ships widens vanilla's API for every mod on the server,
# for the lifetime of the game, and a member no shipped class calls has no business being
# widened there. verifyNoTestScaffoldingInJar reads the shipped file and fails on an entry the
# product's own sources never name, which is what keeps this split honest — the compiler cannot,
# since the dev environment applies every listed file to the same Minecraft artifact.
#
# This path is not a resource root of any source set, so nothing packs it.

# CropBlock#getGrowthSpeed is protected static. CropCatchUp (src/gametest) calls the real
# vanilla method rather than reimplementing it, otherwise the test would only be checking a copy
# of the formula against itself.
# NeoForge patches this method: vanilla takes a Block, NeoForge takes a BlockState.
public net.minecraft.world.level.block.CropBlock getGrowthSpeed(Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/world/level/BlockGetter;Lnet/minecraft/core/BlockPos;)F

# The experience ledger. Only the verification suite touches it, to put a furnace back to a
# genuinely fresh state between the two arms. Breaking and replacing the block would do the
# same but spills the contents and pops the stored experience into the compared region.
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity recipesUsed
