# What the product needs, and nothing else. This file ships inside the jar, so every line here
# widens a vanilla member for every mod on the server that loads it; a member only the
# measurement calls belongs in src/gametest/accesstransformer.cfg, which is not packed.

# The furnace counters are package-private. The catch-up advances them across spans where
# vanilla would only have decremented/incremented them, so it has to read and write them.
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity litTime
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity litDuration
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity cookingProgress
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity cookingTotalTime
