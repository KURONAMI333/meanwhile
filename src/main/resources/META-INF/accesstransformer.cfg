# CropBlock#getGrowthSpeed is protected static. The catch-up must call the real vanilla
# method rather than reimplement it, otherwise the test would only be checking a copy
# of the formula against itself.
# NeoForge patches this method: vanilla takes a Block, NeoForge takes a BlockState.
public net.minecraft.world.level.block.CropBlock getGrowthSpeed(Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/world/level/BlockGetter;Lnet/minecraft/core/BlockPos;)F

# The furnace counters are package-private. The catch-up advances them across spans where
# vanilla would only have decremented/incremented them, so it has to read and write them.
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity litTime
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity litDuration
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity cookingProgress
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity cookingTotalTime

# The experience ledger. Only the verification suite touches it, to put a furnace back to a
# genuinely fresh state between the two arms. Breaking and replacing the block would do the
# same but spills the contents and pops the stored experience into the compared region.
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity recipesUsed
