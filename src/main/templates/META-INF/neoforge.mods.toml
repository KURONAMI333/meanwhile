# Meanwhile - neoforge.mods.toml
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/KURONAMI333/meanwhile/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/KURONAMI333/meanwhile"
description='''
${mod_description}
'''

# The loaded-chunk scheme (BlockStateAnalogReadMixin, BoundTickingBlockEntityMixin,
# LevelChunkSaveMixin, LevelChunkWriteMixin, ServerLevelSchedulerMixin,
# ServerPlayerObservationMixin) is retired from the product; the catch-up-on-load scheme in
# elapsed/ is the product now. The six mixins still exist, moved to
# meanwhile-loaded.mixins.json. Uncomment to bring them back:
#[[mixins]]
#config="meanwhile-loaded.mixins.json"

# SERVER on both, following the 1.21.1 jars of the mods that do the same job (Unloaded Activity
# v0.6.7, Chunky, Spark). Everything here happens on a chunk the server owns, from the server's
# own tick: there is no client class, no renderer, no packet and no screen, so a client that does
# not have it installed is not missing anything a server that does can tell it about.
#
# No displayTest. None of those four jars carries one; the IGNORE_ALL_VERSION advice that turns up
# in search results is old Forge and does not describe this version.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="SERVER"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="SERVER"
